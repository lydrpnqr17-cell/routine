<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="השגרה שלי">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>השגרה שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f0;--card:#fff;--tx:#17231f;--mu:#62736d;--ac:#1f6f5c;--ac2:#dcece6;--bd:#d7e0dc;--bad:#b94a3a;--gold:#c8902a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--card:#18221f;--tx:#e6efec;--mu:#92a69f;--ac:#52c2a5;--ac2:#1f332d;--bd:#2a3a35;--bad:#e0816f;--gold:#e0b04e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101715;--card:#18221f;--tx:#e6efec;--mu:#92a69f;--ac:#52c2a5;--ac2:#1f332d;--bd:#2a3a35;--bad:#e0816f;--gold:#e0b04e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,sans-serif;line-height:1.5;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav{display:flex;gap:6px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.i{padding:2px 8px;border:0;background:none;color:var(--mu)}
input{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.task:last-child{border:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--ac);background:none;padding:0;color:#fff;flex:none;font-weight:700}
.done .chk{background:var(--ac)}
.done .nm{text-decoration:line-through;color:var(--mu)}
.nm{flex:1}.tm{font-size:12px;color:var(--mu)}
.add{display:flex;gap:6px;margin-top:10px}.add input[type=text]{flex:1}
.tip{padding:9px 12px;background:var(--ac2);border-radius:10px;margin-bottom:8px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{border:1px solid var(--bd);border-radius:12px;padding:10px}
.st b{font-size:26px;display:block;font-weight:800}
.up{color:var(--ac)}.dn{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu)}
.bars i{display:block;width:100%;background:var(--ac);border-radius:5px 5px 0 0;min-height:3px}
.pb{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.rate{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}.rate span:first-child{width:38%}.rate .pb{flex:1}
.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:180px;border:0;border-radius:0;padding:14px 4px;background:none;color:var(--mu);font-weight:500}
.tabs button.on{color:var(--ac);font-weight:800;box-shadow:inset 0 3px 0 var(--ac)}
.step{display:flex;align-items:center;gap:10px;padding:8px 0}
.step.done .nm{text-decoration:line-through;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal button{aspect-ratio:1/1.05;padding:2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;font-size:15px}.cal small{font-size:9px;color:var(--mu)}.cal .t{border:2px solid var(--ac)}.cal .s{background:var(--ac2)}.cal .sh b{color:var(--mu)}.dots{display:flex;gap:2px;height:7px}.dots i{width:6px;height:6px;border-radius:50%}.wd{text-align:center;font-size:12px;color:var(--mu);margin-bottom:4px}
textarea{width:100%;font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px;resize:vertical}
.brand{display:flex;align-items:center;gap:6px;color:var(--ac);font-weight:800;font-size:14px;margin-bottom:10px}
#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#2a8670,#145043);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{animation:pop .9s ease both}
#splash .sn{font-size:32px;font-weight:800;letter-spacing:.5px;animation:pop .9s .15s ease both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<script id="seed" type="application/json">null</script>
<script>
const $=s=>document.querySelector(s);
const LOGO=s=>`<svg viewBox='0 0 100 100' width='${s}' height='${s}' fill='none' stroke='currentColor' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><circle cx='50' cy='52' r='30' stroke-dasharray='150 38.5'/><path d='M37 53L47 63L78 28'/></svg>`;
(function(){try{if(sessionStorage.getItem('sp'))return;sessionStorage.setItem('sp','1')}catch(e){}
const d=document.createElement('div');d.id='splash';d.innerHTML=LOGO(120)+`<div class='sn'>השגרה שלי</div>`;document.body.appendChild(d);
setTimeout(()=>d.classList.add('out'),1700);setTimeout(()=>d.remove(),2500)})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='routine_v1';
const DEF={tpl:[{id:'a1',n:'קימה מוקדמת',t:'06:30'},{id:'a2',n:'פעילות גופנית',t:'07:00'},{id:'a3',n:'עבודה ממוקדת',t:'09:00'},{id:'a4',n:'קריאה / למידה',t:'20:00'},{id:'a5',n:'שינה בזמן',t:'23:00'}],days:{},goal:{title:'',why:'',date:'',steps:[]},goals:[{n:'עלייה במשקל',unit:'ק"ג',start:64,cur:64,target:'',date:'',log:[]},{n:'כסף לקניית רכב',unit:'₪',start:0,cur:0,target:'',date:'',log:[]},{n:'חיסכון לטיול בחו"ל',unit:'₪',start:0,cur:0,target:'',date:'',log:[]}]};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
S.tpl=S.tpl||DEF.tpl;S.days=S.days||{};S.goal=S.goal||DEF.goal;S.goals=S.goals||JSON.parse(JSON.stringify(DEF.goals));S.w=S.w||{};S.pr=S.pr||{};
const lsave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{S.ts=Date.now();lsave();schedPush()};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pk=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dk(d)};
const TODAY=dk(new Date());
let cur=TODAY,tab='day';
const tplDay=()=>S.tpl.map(t=>({id:t.id,n:t.n,t:t.t,d:false}));
const getDay=k=>S.days[k]||tplDay();
const ens=k=>S.days[k]||(S.days[k]=tplDay());
if(S.v!==2){S.v=2;S.tpl=[{id:'r1',n:'קימה מוקדמת (6:00-6:20)',t:'06:00'},{id:'r2',n:'ברכות השחר',t:'06:30'},{id:'r3',n:'פרי לפני הקפה של הבוקר',t:'06:45'},{id:'r4',n:'ארוחת בוקר מזינה',t:'07:15'},{id:'r5',n:'ארוחת ביניים עם מקור לחלבון',t:'10:30'},{id:'r6',n:'ארוחת צהריים עם חלבונים ופחמימות',t:'13:30'},{id:'r7',n:'מאכל אנרגטי לפני אימון',t:'16:30'},{id:'r8',n:'אימון',t:'17:30'},{id:'r9',n:'ארוחת ערב: חלבונים, ירקות ופחמימות',t:'19:30'},{id:'r10',n:'עבודה על משהו חדש (מקור הכנסה נוסף: לחקור, לגלות, לבצע)',t:'20:00'},{id:'r11',n:'קריאת ספר (20 דקות לפחות)',t:'21:15'},{id:'r12',n:'צחצוח שיניים לפני שינה',t:'22:30'},{id:'r13',n:'שינה: לפחות 7 שעות עד הקימה',t:'22:45'}];delete S.days[dk(new Date())]}
ens(TODAY);lsave();
const score=k=>{const d=S.days[k];return d&&d.length?Math.round(d.filter(x=>x.d).length/d.length*100):null};
const avg=keys=>{const v=keys.map(score).filter(x=>x!==null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
const range=(from,to)=>{const o=[];for(let k=from;k<=to;k=addD(k,1))o.push(k);return o};
const grade=s=>s===null?'—':s>=90?'מצוין':s>=75?'טוב מאוד':s>=60?'טוב':s>=40?'בדרך':'מתחילים מחדש';
const days=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const dayName=k=>'יום '+['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][pk(k).getDay()];
function periods(A){const avg=A||avgS;
 const t=pk(TODAY),ws=addD(TODAY,-t.getDay());
 const ms=dk(new Date(t.getFullYear(),t.getMonth(),1)),pms=dk(new Date(t.getFullYear(),t.getMonth()-1,1)),pme=addD(ms,-1);
 const ys=t.getFullYear()+'-01-01',pys=(t.getFullYear()-1)+'-01-01',pye=(t.getFullYear()-1)+'-12-31';
 return[['השבוע',avg(range(ws,TODAY)),avg(range(addD(ws,-7),addD(ws,-1))),'מהשבוע שעבר'],
  ['החודש',avg(range(ms,TODAY)),avg(range(pms,pme)),'מהחודש שעבר'],
  ['השנה',avg(range(ys,TODAY)),avg(range(pys,pye)),'מהשנה שעברה'],
  ['30 ימים אחרונים',avg(range(addD(TODAY,-29),TODAY)),avg(range(addD(TODAY,-59),addD(TODAY,-30))),'מה-30 שלפניהם']];
}
function streak(){let n=0,k=TODAY;if((score(k)||0)<70)k=addD(k,-1);while((score(k)||0)>=70){n++;k=addD(k,-1)}return n}
function rates(){const r={};range(addD(TODAY,-29),TODAY).forEach(k=>(S.days[k]||[]).forEach(x=>{(r[x.n]=r[x.n]||{a:0,b:0}).b++;if(x.d)r[x.n].a++}));
 return Object.entries(r).map(([n,v])=>({n,p:Math.round(v.a/v.b*100),c:v.b})).sort((a,b)=>a.p-b.p)}
function tips(){
 const o=[],d=getDay(TODAY),left=d.filter(x=>!x.d),sc=score(TODAY),r=rates().filter(x=>x.c>=3);
 if(!d.length)o.push('הוסף כמה משימות קבועות ליום כדי להתחיל לקבל ציון.');
 else if(sc===100)o.push('יום מושלם! שמור על הקצב ותכנן מראש את מחר.');
 else if(left.length){const nx=left.filter(x=>x.t).sort((a,b)=>a.t.localeCompare(b.t))[0]||left[0];o.push('המשימה הבאה: «'+nx.n+'»'+(nx.t?' ('+nx.t+')':'')+'. התחל בה ל-5 דקות בלבד, ההתחלה היא החלק הקשה.')}
 if(r.length&&r[0].p<60)o.push('«'+r[0].n+'» מצליחה רק ב-'+r[0].p+'% מהימים. נסה להקטין אותה (גרסה קלה יותר) או להזיז לשעה קלה יותר, ולחבר אותה להרגל קיים.');
 const wk=periods()[0];if(wk[1]!==null&&wk[2]!==null){if(wk[1]>wk[2])o.push('השבוע טוב יותר מהשבוע שעבר ב-'+(wk[1]-wk[2])+' נקודות. כל הכבוד, מה עבד? תעשה עוד מזה.');else if(wk[1]<wk[2])o.push('השבוע נמוך ב-'+(wk[2]-wk[1])+' נקודות מהשבוע שעבר. בחר משימה אחת לחזק מחר ולא הכל בבת אחת.')}
 const s=streak();if(s>=3)o.push('רצף של '+s+' ימים טובים (70%+). אל תשבור את השרשרת!');
 {const i=pinfo(TODAY);if(S.w[TODAY]==null)o.push('מלא את משקל הגוף של הבוקר כדי לחשב את יעד החלבון להיום.');else if(i.t&&i.tot<i.t)o.push('נשארו עוד '+(i.t-i.tot)+' גרם חלבון להיום. ארוחת ביניים או שייק יכולים לסגור את הפער.');else if(i.t)o.push('יעד החלבון להיום הושג, כל הכבוד!')}
 S.goals.forEach(gl=>{const m=gmeta(gl);if(m.tip)o.push(m.tip)});
 o.push('לפני השינה: הכן ביגוד ושולחן לבוקר ורשום את 3 העדיפויות של מחר.');
 return o.slice(0,7)}
function ring(p){const r=44,c=2*Math.PI*r,v=p||0;return'<svg viewBox="0 0 104 104" width="104" height="104"><circle cx="52" cy="52" r="'+r+'" fill="none" stroke="var(--ac2)" stroke-width="10"/><circle cx="52" cy="52" r="'+r+'" fill="none" stroke="var(--ac)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c*(1-v/100)+'" transform="rotate(-90 52 52)"/></svg><b>'+(p===null?'—':p)+'</b>'}
function viewDay(){
 const d=getDay(cur),sc=d.length?Math.round(d.filter(x=>x.d).length/d.length*100):null;
 const dt=pk(cur);
 return'<div class="top"><h1>השגרה שלי</h1><div class="nav"><button data-a="prev">›</button><button data-a="today">היום</button><button data-a="next">‹</button></div></div>'+
 '<div class="card hero"><div class="ring">'+ring(sc)+'</div><div><div class="mu">'+dayName(cur)+', '+dt.getDate()+'.'+(dt.getMonth()+1)+'.'+dt.getFullYear()+' · '+hebDate(cur)+'</div>'+(holi(cur).length?'<div class="up" style="font-size:13px;font-weight:700">'+esc(holi(cur).join(' · '))+'</div>':'')+'<h2 style="margin:2px 0">'+grade(sc)+'</h2><div class="mu">'+d.filter(x=>x.d).length+' מתוך '+d.length+' משימות · רצף '+streak()+' ימים</div></div></div>'+
 ''+pcard()+'<div class="card"><h2>המשימות של היום</h2>'+(d.length?d.slice().map((x,i)=>({x,i})).sort((a,b)=>(a.x.t||'99').localeCompare(b.x.t||'99')).map(({x,i})=>'<div class="task '+(x.d?'done':'')+'"><button class="chk" data-a="tog" data-i="'+i+'" aria-label="סמן">'+(x.d?'✓':'')+'</button><div class="nm">'+esc(x.n)+(x.t?'<div class="tm">'+esc(x.t)+'</div>':'')+ftip(x.id,cur)+'</div>'+pin(x.id)+'<button class="i" data-a="edit" data-i="'+i+'" aria-label="ערוך">✎</button><button class="i" data-a="del" data-i="'+i+'" aria-label="מחק">✕</button></div>').join(''):'<div class="mu">אין משימות. הוסף את הראשונה למטה.</div>')+
 '<div class="add"><input type="text" id="nn" placeholder="משימה חדשה"><input type="time" id="nt"><button class="p" data-a="add">הוסף</button></div></div>'+
 '<div class="card"><h2>עצות להמשך</h2>'+tips().map(t=>'<div class="tip">'+esc(t)+'</div>').join('')+'</div>'+
 '<div class="card"><h2>הערת היום</h2><textarea id="note" rows="2" placeholder="מה למדתי היום? מה הפריע לי?">'+esc((S.notes||{})[cur]||'')+'</textarea></div>'}
function viewStats(){
 const p=periods(),last=range(addD(TODAY,-13),TODAY),r=rates();
 return'<div class="top"><h1>סטטיסטיקה וציונים</h1></div><div class="card"><div class="grid">'+p.map(x=>{const dl=x[1]!==null&&x[2]!==null?x[1]-x[2]:null;return'<div class="st"><span class="mu">'+x[0]+'</span><b>'+(x[1]===null?'—':x[1])+'</b><span class="mu">'+grade(x[1])+'</span>'+(dl===null?'':'<div class="'+(dl>=0?'up':'dn')+'" style="font-size:12px">'+(dl>=0?'▲ ':'▼ ')+Math.abs(dl)+' '+x[3]+'</div>')+'</div>'}).join('')+'</div></div>'+
 ''+pstats()+'<div class="card"><h2>14 הימים האחרונים</h2><div class="bars">'+last.map(k=>{const s=score(k);return'<div title="'+k+'"><span>'+(s===null?'':s)+'</span><i style="height:'+(s||0)*0.7+'%;'+(s===null?'opacity:.15':'')+'"></i><span>'+days[pk(k).getDay()]+'</span></div>'}).join('')+'</div></div>'+
 '<div class="card"><h2>הצלחה לפי משימה (30 יום)</h2>'+(r.length?r.slice().reverse().map(x=>'<div class="rate"><span>'+esc(x.n)+'</span><div class="pb"><i style="width:'+x.p+'%"></i></div><span>'+x.p+'%</span></div>').join(''):'<div class="mu">עדיין אין נתונים.</div>')+'</div>'+
 '<div class="card"><button data-a="imp">ייבוא גיבוי</button> <button data-a="export">ייצוא גיבוי</button> <button data-a="theme">מצב כהה / בהיר</button> <button data-a="reset">איפוס</button></div>'}
function viewGoal(){
 const g=S.goal,n=g.steps.length,dn=g.steps.filter(x=>x.d).length,pc=n?Math.round(dn/n*100):0;
 const left=g.date?Math.ceil((pk(g.date)-pk(TODAY))/864e5):null;
 return'<div class="top"><h1>היעד שלי</h1></div><div class="card"><input id="gt" style="width:100%;font-weight:700;font-size:18px" placeholder="מה היעד המרכזי שלך?" value="'+esc(g.title)+'"><div class="add"><input type="text" id="gw" placeholder="למה זה חשוב לי?" value="'+esc(g.why)+'"><input type="date" id="gd" value="'+esc(g.date)+'"></div>'+(left!==null?'<div class="mu" style="margin-top:8px">'+(left>=0?'נותרו '+left+' ימים ליעד':'תאריך היעד עבר')+'</div>':'')+'</div>'+
 '<div class="card"><h2>הדרך ליעד · '+pc+'%</h2><div class="pb"><i style="width:'+pc+'%"></i></div>'+(n?g.steps.map((x,i)=>'<div class="step '+(x.d?'done':'')+'"><button class="chk" data-a="gtog" data-i="'+i+'">'+(x.d?'✓':'')+'</button><div class="nm">'+esc(x.t)+'</div><button class="i" data-a="gdel" data-i="'+i+'">✕</button></div>').join(''):'<div class="mu" style="margin-top:10px">פרק את היעד לצעדים קטנים. הצעד הראשון צריך לקחת פחות מ-10 דקות.</div>')+
 '<div class="add"><input type="text" id="gs" placeholder="צעד חדש בדרך"><button class="p" data-a="gadd">הוסף</button></div></div>'+
 '<div class="card"><h2>עצה</h2><div class="tip">'+esc(tips().find(t=>t.includes('היעד')||t.includes('יעד מרכזי'))||'התקדם צעד אחד כל יום.')+'</div></div>'}

 return`<div class='card'><h2>ציון חלבון</h2><div class='grid'>${p.map(x=>{const dl=x[1]!==null&&x[2]!==null?x[1]-x[2]:null;return`<div class='st'><span class='mu'>${x[0]}</span><b>${x[1]===null?'—':x[1]}</b><span class='mu'>${grade(x[1])}</span>${dl===null?'':`<div class='${dl>=0?'up':'dn'}' style='font-size:12px'>${dl>=0?'▲ ':'▼ '}${Math.abs(dl)} ${x[3]}</div>`}</div>`}).join('')}</div><div class='mu' style='margin:10px 0 6px'>עמדת ביעד ב-${hit} מתוך 30 הימים האחרונים</div><div class='bars'>${last.map(k=>{const s=pscore(k);return`<div title='${k}'><span>${s===null?'':s}</span><i style='height:${(s||0)*0.7}%;background:var(--gold);${s===null?'opacity:.15':''}'></i><span>${days[pk(k).getDay()]}</span></div>`}).join('')}</div></div>`}
function render(){
 $('#app').innerHTML=tab==='day'?viewDay():tab==='stats'?viewStats():tab==='cal'?viewCal():viewGoals();
 $('#tabs').innerHTML=[['day','היום'],['cal','לוח שנה'],['stats','ציונים'],['goal','מטרות על']].map(([k,l])=>'<button data-tab="'+k+'" class="'+(tab===k?'on':'')+'">'+l+'</button>').join('')}
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;if(RO&&!NAV.includes(a))return;
 if(a==='prev'){cur=addD(cur,-1)}else if(a==='next'){if(cur<TODAY)cur=addD(cur,1)}else if(a==='today'){cur=TODAY}
 else if(a==='tog'){ens(cur)[i].d=!S.days[cur][i].d}
 else if(a==='add'){const n=$('#nn').value.trim();if(!n)return;const x={id:'t'+Date.now(),n,t:$('#nt').value};ens(cur).push({...x,d:false});S.tpl.push(x)}
 else if(a==='edit'){const d=ens(cur),x=d[i],n=prompt('שם המשימה',x.n);if(n===null)return;const t=prompt('שעה (למשל 07:30, אפשר ריק)',x.t||'');x.n=n.trim()||x.n;x.t=t===null?x.t:t;const tp=S.tpl.find(y=>y.id===x.id);if(tp){tp.n=x.n;tp.t=x.t}}
 else if(a==='del'){const d=ens(cur),x=d[i];if(!confirm('למחוק את «'+x.n+'» מהיום ומהשגרה הקבועה?'))return;d.splice(i,1);S.tpl=S.tpl.filter(y=>y.id!==x.id)}
 else if(a==='cprev'||a==='cnext'){const f=pk(calM);calM=dk(new Date(f.getFullYear(),f.getMonth()+(a==='cnext'?1:-1),1))}
 else if(a==='pub'){publishNow();return}
 else if(a==='ctoday'){calM=TODAY.slice(0,8)+'01';calSel=TODAY}
 else if(a==='csel'){calSel=b.dataset.k}
 else if(a==='copen'){cur=calSel;tab='day'}
 else if(a==='gnew'){const n=prompt('שם המטרה');if(!n)return;const u=prompt('יחידה (₪, ק"ג, ...)','₪')||'';S.goals.push({n,unit:u,start:0,cur:0,target:'',date:'',log:[]})}
 else if(a==='grm'){if(!confirm('למחוק את «'+S.goals[i].n+'»?'))return;S.goals.splice(i,1)}
 else if(a==='gupd'){const v=parseFloat($('#gv'+i).value);if(isNaN(v))return;const g=S.goals[i];g.cur=v;g.log.push({k:TODAY,v})}
 else if(a==='gtog'){S.goal.steps[i].d=!S.goal.steps[i].d}
 else if(a==='gdel'){S.goal.steps.splice(i,1)}
 else if(a==='gadd'){const t=$('#gs').value.trim();if(!t)return;S.goal.steps.push({t,d:false})}
 else if(a==='theme'){const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#101715';r.dataset.theme=dark?'light':'dark';return}
 else if(a==='export'){prompt('העתק את הגיבוי ושמור אותו',JSON.stringify(S));return}
 else if(a==='imp'){const t=prompt('הדבק כאן את טקסט הגיבוי');if(!t)return;try{const r=JSON.parse(t);if(!r.days)throw 0;S=r;S.w=S.w||{};S.pr=S.pr||{};S.goals=S.goals||[];S.tpl=S.tpl||[];ens(TODAY)}catch(e){alert('הגיבוי לא תקין');return}}
 else if(a==='reset'){if(!confirm('למחוק את כל הנתונים?'))return;S=JSON.parse(JSON.stringify(DEF));S.w={};S.pr={};ens(TODAY)}
 save();render()});
document.addEventListener('change',e=>{
 if(e.target.dataset.pg){const v=parseFloat(e.target.value),id=e.target.dataset.pg;S.pr[cur]=S.pr[cur]||{};if(isNaN(v)||v<=0)delete S.pr[cur][id];else S.pr[cur][id]=v;if(!Object.keys(S.pr[cur]).length)delete S.pr[cur];save();updP();return}
 if(e.target.id==='wt'){const v=parseFloat(e.target.value);if(v>20&&v<300){S.w[cur]=v;if(cur===TODAY){const g=S.goals.find(x=>x.unit==='ק"ג');if(g){g.cur=v;g.log=g.log.filter(x=>x.k!==TODAY);g.log.push({k:TODAY,v})}}}else delete S.w[cur];save();updP();return}
 if(e.target.dataset.gf){const g=S.goals[+e.target.dataset.i],f=e.target.dataset.gf,v=e.target.value;g[f]=f==='date'||v===''?v:parseFloat(v);save();render();return}
 if(e.target.id==='note'){S.notes=S.notes||{};S.notes[cur]=e.target.value;save()}
 if(['gt','gw','gd'].includes(e.target.id)){S.goal.title=$('#gt').value;S.goal.why=$('#gw').value;S.goal.date=$('#gd').value;save();render()}});
let DB=null,CAN=false,RO=false,pt=null,pend=false,ART=null;const pushed={},mts={};
const NAV=['prev','next','today','cprev','cnext','ctoday','csel','copen','theme','export'];
const ym=k=>k.slice(0,7);
let pt2=null;
function schedPush(){if(!CAN)return;if(DB){clearTimeout(pt);pt=setTimeout(push,900)}if(ART){clearTimeout(pt2);pt2=setTimeout(function w(){if(busy()){pt2=setTimeout(w,5000);return}publishNow()},60000)}}
async function push(){if(!DB||!CAN)return;const ts=S.ts||(S.ts=Date.now());const core=Object.assign({},S);delete core.days;const cj=JSON.stringify(core);
 try{if(pushed.c!==cj){await DB.doc('sync/core').set({j:cj,ts});pushed.c=cj}
  const ms={};for(const k in S.days)(ms[ym(k)]=ms[ym(k)]||{})[k]=S.days[k];
  for(const m in ms){const j=JSON.stringify(ms[m]);if(pushed[m]!==j){mts[m]=ts;await DB.doc('days/'+m).set({j,ts});pushed[m]=j}}}catch(e){}}
const busy=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA/.test(a.tagName)};
function refresh(){if(busy()){pend=true;return}render()}
document.addEventListener('focusout',()=>{if(pend){pend=false;setTimeout(()=>{if(!busy())render()},50)}});
function onCore(snap){if(!snap.exists)return;const d=snap.data(),ts=d.ts||0;if(RO||ts>(S.ts||0)){try{const r=JSON.parse(d.j),days=S.days;S=Object.assign({},r,{days});S.ts=ts;lsave();refresh()}catch(e){}}}
function onMonths(snap){let ch=false;snap.docs.forEach(x=>{const d=x.data();if(!d)return;const ts=d.ts||0;if(RO||ts>(mts[x.id]||0)){try{Object.assign(S.days,JSON.parse(d.j));mts[x.id]=ts;ch=true}catch(e){}}});if(ch){lsave();refresh()}}
async function publishNow(){if(!ART||!CAN)return;S.ts=S.ts||Date.now();const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#tabs').innerHTML='';c.removeAttribute('data-theme');const sp=c.querySelector('#splash');if(sp)sp.remove();c.querySelector('#seed').textContent=JSON.stringify(S).split('<').join(String.fromCharCode(92)+'u003c');try{await ART.publish('<!DOCTYPE html>'+String.fromCharCode(10)+c.outerHTML)}catch(e){}}
const _r=render;render=function(){_r();if(RO){document.querySelectorAll('#app input,#app textarea').forEach(x=>x.disabled=true);$('#app').insertAdjacentHTML('afterbegin',`<div class='tip'>מצב צפייה: אתה רואה את המצב האחרון שבעל האתר פרסם.</div>`)}$('#app').insertAdjacentHTML('afterbegin',`<div class='brand'>${LOGO(22)}<span>השגרה שלי</span></div>`)};
(async()=>{
 if(typeof claude==='undefined')return;
 let sd=null;try{sd=JSON.parse(document.getElementById('seed').textContent)}catch(e){}
 try{const u=await claude.use('user');CAN=!!(u&&await u.canEdit())}catch(e){}
 try{ART=await claude.use('artifact')}catch(e){}
 try{DB=await claude.use('db')}catch(e){}
 RO=!CAN&&!!(sd||DB);
 const fix=()=>{S.days=S.days||{};S.w=S.w||{};S.pr=S.pr||{};S.goals=S.goals||[];S.tpl=S.tpl||[]};
 if(sd&&(RO||((sd.ts||0)>(S.ts||0)&&!DB))){S=sd;fix();lsave()}
 if(DB){
  try{
   const c=await DB.doc('sync/core').get(),ms=await DB.collection('days').get();
   const rts=c.exists?(c.data().ts||0):0;
   if(c.exists&&(RO||rts>(S.ts||0))){const r=JSON.parse(c.data().j),days={};ms.docs.forEach(x=>{try{Object.assign(days,JSON.parse(x.data().j));mts[x.id]=x.data().ts||0}catch(e){}});S=Object.assign({},r,{days});S.ts=rts;fix();lsave()}
   else if(CAN){fix();Object.keys(S.days).forEach(k=>{mts[ym(k)]=S.ts||0});S.ts=S.ts||Date.now();push()}
   DB.doc('sync/core').onSnapshot(onCore,()=>{});DB.collection('days').onSnapshot(onMonths,()=>{});
  }catch(e){}
 }
 if(!RO){fix();ens(TODAY);lsave()}
 render();
})();
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
